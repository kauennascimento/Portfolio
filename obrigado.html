<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Mensagem enviada com sucesso para Kauê Nascimento."
    />

    <title>Mensagem enviada • Kauê Nascimento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0f1724;
        --bg-dark: #071025;
        --card: #0b1220;
        --muted: #9aa3b2;
        --text: #eef2ff;
        --accent: #7c3aed;
        --accent-light: #a78bfa;
        --success: #34d399;
        --border: rgba(255, 255, 255, 0.08);
        --radius: 20px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;

        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;

        color: var(--text);

        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(124, 58, 237, 0.18),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(45, 212, 191, 0.1),
            transparent 30%
          ),
          linear-gradient(180deg, var(--bg-dark) 0%, var(--bg) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        opacity: 0.2;
      }

      body::before {
        top: -120px;
        left: -120px;
        background: var(--accent);
      }

      body::after {
        right: -120px;
        bottom: -120px;
        background: #2dd4bf;
      }

      .container {
        width: 100%;
        max-width: 620px;
        position: relative;
        z-index: 1;
      }

      /* Identidade */

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      .logo {
        width: 48px;
        height: 48px;

        display: grid;
        place-items: center;

        overflow: hidden;

        border-radius: 11px;

        background: linear-gradient(135deg, var(--accent), #2dd4bf);

        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.25);
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 11px;
      }

      .brand-name {
        font-size: 15px;
        font-weight: 600;
      }

      .brand-role {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      /* Card principal */

      .card {
        position: relative;
        overflow: hidden;

        padding: 48px 42px;

        text-align: center;

        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.04),
            rgba(255, 255, 255, 0.01)
          ),
          var(--card);

        border: 1px solid var(--border);
        border-radius: var(--radius);

        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.35),
          0 8px 30px rgba(2, 6, 23, 0.35);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .card::before {
        content: "";
        position: absolute;

        top: 0;
        left: 10%;

        width: 80%;
        height: 2px;

        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          #2dd4bf,
          transparent
        );
      }

      /* Ícone */

      .success-icon {
        width: 84px;
        height: 84px;

        display: grid;
        place-items: center;

        margin: 0 auto 26px;

        border-radius: 50%;

        color: var(--success);

        background: rgba(52, 211, 153, 0.08);

        border: 1px solid rgba(52, 211, 153, 0.25);

        box-shadow:
          0 0 0 8px rgba(52, 211, 153, 0.025),
          0 12px 35px rgba(52, 211, 153, 0.08);
      }

      .success-icon svg {
        width: 40px;
        height: 40px;

        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Textos */

      .status {
        margin-bottom: 10px;

        color: var(--accent-light);

        font-size: 12px;
        font-weight: 600;

        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      h1 {
        margin-bottom: 14px;

        font-size: clamp(28px, 5vw, 38px);
        line-height: 1.15;
        letter-spacing: -0.8px;
      }

      .description {
        max-width: 480px;
        margin: 0 auto;

        color: var(--muted);

        font-size: 15px;
        line-height: 1.7;
      }

      .description strong {
        color: var(--text);
        font-weight: 600;
      }

      /* Divisor */

      .divider {
        width: 100%;
        height: 1px;

        margin: 30px 0;

        background: rgba(255, 255, 255, 0.06);
      }

      /* Aviso */

      .notice {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        margin-bottom: 28px;

        color: var(--muted);

        font-size: 13px;
        line-height: 1.5;
      }

      .notice-icon {
        flex-shrink: 0;

        width: 32px;
        height: 32px;

        display: grid;
        place-items: center;

        border-radius: 9px;

        color: var(--accent-light);
        background: rgba(124, 58, 237, 0.1);
      }

      .notice-icon svg {
        width: 17px;
        height: 17px;

        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Botão */

      .actions {
        display: flex;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;

        min-width: 190px;

        padding: 13px 20px;

        color: #ffffff;

        background: linear-gradient(135deg, var(--accent), #6d28d9);

        border: 1px solid rgba(167, 139, 250, 0.2);
        border-radius: 11px;

        box-shadow: 0 8px 24px rgba(124, 58, 237, 0.25);

        font-family: inherit;
        font-size: 14px;
        font-weight: 600;

        text-decoration: none;

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);

        box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35);
      }

      .btn:focus-visible {
        outline: 3px solid rgba(124, 58, 237, 0.3);
        outline-offset: 3px;
      }

      .btn svg {
        width: 17px;
        height: 17px;

        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Rodapé */

      footer {
        margin-top: 22px;

        color: var(--muted);

        text-align: center;

        font-size: 12px;
      }

      footer span {
        color: rgba(238, 242, 255, 0.75);
      }

      /* Responsividade */

      @media (max-width: 560px) {
        body {
          padding: 16px;
        }

        .brand {
          margin-bottom: 18px;
        }

        .card {
          padding: 38px 24px;
        }

        .success-icon {
          width: 72px;
          height: 72px;
          margin-bottom: 22px;
        }

        .success-icon svg {
          width: 34px;
          height: 34px;
        }

        h1 {
          font-size: 29px;
        }

        .description {
          font-size: 14px;
        }

        .notice {
          align-items: flex-start;
          text-align: left;
        }

        .btn {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }

        .btn:hover {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header class="brand">
        <div class="logo">
          <img src="img1.jpg" alt="Logo de Kauê Nascimento" />
        </div>

        <div>
          <div class="brand-name">Kauê Nascimento</div>

          <div class="brand-role">Desenvolvedor Web • Front-end</div>
        </div>
      </header>

      <main class="card">
        <div class="success-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </div>

        <div class="status">Enviado com sucesso</div>

        <h1>Mensagem enviada!</h1>

        <p class="description">
          Obrigado por entrar em contato. Sua mensagem foi
          <strong>recebida com sucesso</strong>
          e será analisada em breve.
        </p>

        <div class="divider"></div>

        <div class="notice">
          <div class="notice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 4h16v16H4z" />
              <path d="m4 5 8 7 8-7" />
            </svg>
          </div>

          <span> Seu contato foi encaminhado com sucesso. </span>
        </div>

        <div class="actions">
          <a class="btn" href="https://portifolio-iota-ivory-25.vercel.app/">
            Voltar ao portfólio

            <svg viewBox="0 0 24 24">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </a>
        </div>
      </main>

      <footer>
        © <span id="year"></span> Kauê Nascimento — todos os direitos reservados
      </footer>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
